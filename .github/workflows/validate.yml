name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q --cov=custom_components.buderus_rc30 --cov-report=term-missing
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno lint custom_components/buderus_rc30/www tests/frontend
      - run: deno fmt --check custom_components/buderus_rc30/www tests/frontend
      - run: deno test tests/frontend
      - name: Build installable package
        run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: buderus_rc30
          path: dist/buderus_rc30.zip
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
